<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Old Web Showroom</title>
<style>
  /* PS1 Gran Turismo car-select menu, wearing old-web furniture. Deliberately dark — it's a lit stage. */
  *{box-sizing:border-box}
  html{height:100%}
  body{margin:0;min-height:100%;color:#eef3fb;
    background:radial-gradient(135% 85% at 50% -12%, #16407e 0%, #0b2450 32%, #06112b 64%, #03060f 100%) fixed;
    font:15px/1.6 Helvetica,Arial,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px);background-size:100% 3px}
  .stage{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:9vh 22px 7vh}

  .masthead{text-align:center;margin-bottom:40px}
  .masthead .kick{margin:0 0 18px;font-size:10px;letter-spacing:.5em;color:#6e86a8}
  .masthead h1{margin:0;font-size:clamp(26px,5.2vw,44px);font-weight:700;letter-spacing:.14em;
    background:linear-gradient(#ffffff,#9db6da);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,.45)}
  .masthead .sub{margin:14px 0 0;font-size:13px;font-style:italic;color:#8fa6c4}
  .masthead .meta{margin:20px 0 0;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#6e86a8}
  .masthead .meta .count{color:#2bd6ff}
  .masthead .meta i{margin:0 14px;font-style:normal;color:#3a5278}

  .grid{border-top:1px solid rgba(120,160,220,.16)}
  .row{position:relative;display:grid;grid-template-columns:3.4ch 1fr auto 2ch;align-items:center;gap:18px;
    padding:13px 16px;text-decoration:none;color:inherit;border-bottom:1px solid rgba(120,160,220,.1);
    transition:background .14s ease,transform .14s ease}
  .row:last-child{border-bottom:0}
  .row .no{font:11px/1 ui-monospace,Menlo,Consolas,monospace;color:#5f78a0;letter-spacing:.05em}
  .row .nm{font-size:16px;font-weight:600;letter-spacing:.02em;color:#dce6f5;transition:color .14s ease}
  .row .er{justify-self:end;text-align:right;max-width:42ch;font-size:12px;color:#6e86a8}
  .row .go{justify-self:end;color:#2bd6ff;opacity:0;transform:translateX(-6px);transition:.14s ease}
  /* the GT selection bar — a bright edge that slides in and lights the row */
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,#2bd6ff,rgba(43,120,220,0));box-shadow:0 0 14px rgba(43,214,255,.5);
    transition:width .14s ease}
  .row:hover,.row:focus-visible{outline:0;transform:translateX(2px);
    background:linear-gradient(90deg,rgba(43,120,220,.22),rgba(43,120,220,.02))}
  .row:hover::before,.row:focus-visible::before{width:3px}
  .row:hover .nm,.row:focus-visible .nm{color:#fff}
  .row:hover .no,.row:focus-visible .no{color:#2bd6ff}
  .row:hover .go,.row:focus-visible .go{opacity:1;transform:none}
  .soon{opacity:.5}

  .ring{margin-top:40px;text-align:center}
  .webring{display:flex;gap:22px;justify-content:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .webring a{color:#8fa6c4;text-decoration:none;transition:color .14s ease}
  .webring a:hover{color:#2bd6ff}
  .counter{margin:22px auto 0;display:inline-flex;align-items:center;gap:12px}
  .counter .clabel{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#5f78a0}
  .counter .digits{font:16px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.42em;
    color:#cfe6a0;background:#05100a;border:1px solid #16351f;padding:7px 10px 7px 14px;border-radius:2px;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.7)}
  .fine{margin:22px 0 0;font-size:11px;line-height:1.7;color:#51688a}

  @media(max-width:560px){.row{grid-template-columns:3ch 1fr;gap:12px}.row .er,.row .go{display:none}.webring{gap:14px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}.row::before{display:none}.row:hover{transform:none}.go{display:none}}
</style>
</head>
<body>
<div class="stage">
  <header class="masthead">
    <p class="kick">THE OLD WEB · ON DISPLAY</p>
    <h1>The Old Web Showroom</h1>
    <p class="sub">a showroom for those who may be interested</p>
    <p class="meta"><span class="since">on display since 1996</span><i>·</i><span class="count" id="count">exhibits</span></p>
  </header>
  <nav id="grid" class="grid"></nav>
  <footer class="ring">
    <div class="webring">
      <a href="#" rel="nofollow">◄ Prev</a>
      <a href="#" rel="nofollow">Random</a>
      <a href="#" rel="nofollow">Next ►</a>
    </div>
    <div class="counter">
      <span class="clabel">visitors</span>
      <span class="digits">012947</span>
    </div>
    <p class="fine">best viewed in any browser · hand-coded · a showroom for those who may be interested</p>
  </footer>
</div>

<script>
// single source of truth — flip done:true and add the file to templates/ as each ships.
// slugs starting "_" are authoring utilities and stay out of the showroom.
const T=[
 {s:"_blank",        n:"Blank Skeleton",      d:"START HERE — empty skeleton, every slot, copy to begin a new one", done:true},
 {s:"meridian",      n:"Meridian",            d:"90s Camel rally Dakar — sand & light blue, Unix clean", done:true},
 {s:"funky-ad",      n:"Funky Ad-Ridden",     d:"Banner hell, blinking promos, pop-up energy", done:true},
 {s:"deep-web",      n:"Deep Web Portal",     d:"Obscure index, onion-grade minimal, cryptic links", done:true},
 {s:"hacker-neon",   n:"Hacker Neon Minimal", d:"Black void, mono green/cyan, terminal cool", done:true},
 {s:"frutiger",      n:"Frutiger Nostalgia",  d:"Glossy aero, bubbles, soft gradients, animated", done:true},
 {s:"fluo-pink",     n:"Fluo Pink Girly",     d:"Hot pink, glitter, sparkle cursors, 2000s tween", done:true},
 {s:"dumb-base",     n:"DUMB Secret Base",    d:"Submarine military console, redacted, status lights", done:true},
 {s:"bbs",           n:"BBS Dial-Up Board",   d:"ANSI art, amber phosphor, NO CARRIER", done:true},
 {s:"dos-commander", n:"DOS Commander",       d:"Blue panels, F-key footer, file lists", done:true},
 {s:"teletext",      n:"Teletext / Ceefax",   d:"Chunky color blocks, page numbers, broadcast grid", done:true},
 {s:"geocities",     n:"Geocities",           d:"Tiled bg, spinning GIFs, under construction, webring", done:true},
 {s:"brutalist",     n:"Brutalist Swiss",     d:"Raw Helvetica, hairline rules, exposed grid", done:true},
 {s:"y2k-aqua",      n:"Y2K Chrome / Aqua",   d:"Glossy bevels, lens flare, liquid metal", done:true},
 {s:"memphis",       n:"Memphis Postmodern",  d:"Squiggles, confetti triangles, pastel + black", done:true},
 {s:"vaporwave",     n:"Vaporwave Mall",      d:"Marble busts, pink/teal, katakana, 退廃", done:true},
 {s:"arcade-crt",    n:"Arcade CRT",          d:"Scanlines, high-score table, insert coin", done:true},
 {s:"constructivist",n:"Soviet Constructivist",d:"Red/black diagonal, bold sans, poster angles", done:true},
 {s:"grimoire",      n:"Occult Grimoire",     d:"Parchment, woodcut borders, sigils, dark academia", done:true},
 {s:"winamp",        n:"Winamp Skin",         d:"EQ bars, spectrum visualizer, chrome chassis", done:true},
 {s:"zine-punk",     n:"Zine Punk",           d:"Ransom-note type, photocopy texture, duct tape", done:true},
 {s:"ps1-memcard",   n:"PS1 Memory Card",     d:"Console save-screen UI, blocky icons", done:true},
 {s:"myspace",       n:"MySpace 2005",        d:"Glitter, top-8, autoplay profile vibe", done:true},
 {s:"amiga-workbench",n:"Amiga Workbench",    d:"Grey/blue/orange desktop, icon windows, drag bars", done:true},
 {s:"mainframe-3270",n:"Mainframe 3270",      d:"IBM green-screen terminal, protected fields, PF keys", done:true},
 {s:"oscilloscope",  n:"Oscilloscope",        d:"Phosphor vector display — graticule, glowing traces", done:true},
 {s:"c64-basic",     n:"Commodore 64 BASIC",  d:"Blue boot screen, READY. prompt, PETSCII", done:true},
 {s:"frames-site",   n:"Frames Site",         d:"Classic frameset — sidebar nav + content pane", done:true},
 {s:"win95-desktop", n:"Windows 95 Desktop",  d:"Start bar, beveled windows, desktop icons", done:true},
 {s:"angelfire-mall",n:"Angelfire Directory", d:"Free-host link farm — banners, awards, webring", done:true},
 {s:"hotline-server",n:"Hotline Server",      d:"Mac OS 8 tracker — files, news, chat", done:true},
 {s:"art-deco",      n:"Art Deco",            d:"1920s gold & black geometry, sunburst, display serif", done:true},
 {s:"mid-century",   n:"Mid-Century Atomic",  d:"50s googie — starbursts, boomerangs, mustard/teal", done:true},
 {s:"pulp-paperback",n:"Pulp Paperback",      d:"Lurid dime-novel cover — bold title, melodrama", done:true},
 {s:"newspaper",     n:"Broadsheet News",     d:"Vintage front page — masthead, columns, halftone", done:true},
 {s:"bauhaus",       n:"Bauhaus",             d:"Primary red/blue/yellow, geometric forms, poster grid", done:true},
 {s:"myspace-emo",   n:"MySpace Emo",         d:"Black + neon scene profile, skulls, stars, Top 8", done:true},
 {s:"ipod-click",    n:"iPod Click Wheel",    d:"White/silver iPod — LCD menu + click wheel", done:true},
 {s:"early-youtube", n:"Early YouTube 2006",  d:"Beige Web 2.0 watch page, stars, related videos", done:true},
 {s:"flash-portal",  n:"Flash Portal",        d:"Newgrounds-style grid, star scores, SKIP INTRO", done:true},
 {s:"cyberpunk-hud", n:"Cyberpunk HUD",       d:"Neon-noir net-runner terminal, reticle, katakana", done:true},
 {s:"seapunk",       n:"Seapunk",             d:"2012 Tumblr aqua — dolphins, yin-yangs, wet web", done:true},

 {s:"fax-cover",     n:"Fax Cover Sheet",     d:"Thermal-paper transmission — TO/FROM, typewriter", done:true},
 {s:"tamagotchi",    n:"Tamagotchi",          d:"90s LCD virtual pet — pixel creature, 3 buttons", done:true},
 {s:"win31-progman", n:"Program Manager",     d:"Windows 3.1 — icon groups, 16-bit grey bevels", done:true},
 {s:"macos-system7", n:"Mac System 7",        d:"1-bit Macintosh — pinstripe menubar, folders", done:true},
 {s:"nextstep",      n:"NeXTSTEP",            d:"Slate workstation — vertical dock, chiseled bevels", done:true},
 {s:"beos",          n:"BeOS",                d:"Yellow-tab windows, teal desktop, Deskbar", done:true},
 {s:"os2-warp",      n:"OS/2 Warp",           d:"IBM Workplace Shell — teal desktop, LaunchPad", done:true},
 {s:"enter-splash",  n:"Enter Site Splash",   d:"Flash-era intro — loading bar, ENTER / skip intro", done:true},
 {s:"phpbb-forum",   n:"phpBB Forum",         d:"subSilver board — category tables, thread view", done:true},
 {s:"brochureware",  n:"Brochureware",        d:"Web 1.0 corporate — table layout, left-rail nav", done:true},
 {s:"wap-mobile",    n:"WAP Phone Deck",      d:"2001 feature-phone — numbered deck, soft keys", done:true},
 {s:"livejournal",   n:"LiveJournal",         d:"2003 blog — moods, comments, friends-only locks", done:true},
 {s:"blueprint",     n:"Blueprint",           d:"Cyan-on-blue drafting — title block, dimensions", done:true},
 {s:"risograph",     n:"Risograph",           d:"2-ink overprint zine — halftone, misregistration", done:true},
 {s:"cassette-jcard",n:"Cassette J-Card",     d:"Mixtape insert — tracklist, Dolby, reels", done:true},
 {s:"tv-guide",      n:"TV Listings",         d:"Channel × time grid, teletext colour, now/next", done:true},
 {s:"gameboy-dmg",   n:"Game Boy DMG",        d:"Grey brick — 4-shade green LCD, D-pad + A/B", done:true},
 {s:"solari-board",  n:"Split-Flap Board",    d:"Airport departures — amber flap tiles, status", done:true},
 {s:"pager-lcd",     n:"Pager",               d:"90s beeper — grey-green LCD message queue", done:true},
 {s:"answering-mc",  n:"Answering Machine",   d:"Beige desk unit — 7-seg counter, voicemail stubs", done:true},
 {s:"cinema-marquee",n:"Cinema Marquee",      d:"Movie-palace sign — chasing bulbs, now showing", done:true},
 {s:"psychedelic-60s",n:"Psychedelic Poster", d:"60s Fillmore — warped type, vibrating swirls", done:true},
 {s:"weather-channel",n:"Weather Channel",    d:"Local on the 8s — forecast rows, WeatherSTAR calm", done:true},
 {s:"stock-ticker",  n:"Stock Ticker",        d:"80s trading terminal — amber quotes, green/red crawl", done:true},
 {s:"vhs-osd",       n:"VHS OSD",             d:"VCR on-screen display — blue menu, PLAY, 12:00 blink", done:true},
 {s:"hypercard",     n:"HyperCard",           d:"1-bit Mac stack — cards, link buttons, Home/Prev/Next", done:true},
 {s:"jukebox",       n:"Jukebox",             d:"Wurlitzer selector — title strips, chrome, chasing bulbs", done:true},
 {s:"comic-book",    n:"Comic Book",          d:"Bronze-age page — panels, balloons, halftone, KRAKOW!", done:true},
 {s:"test-card",     n:"Test Card",           d:"Broadcast standby — colour bars, grid, ident clock", done:true},
 {s:"casio-watch",   n:"Casio F-91W",         d:"Digital watch LCD — 7-seg, MODE/LIGHT, mode tabs", done:true},
 {s:"pinball-backglass",n:"Pinball Backglass",d:"Lit backglass — score reels, feature lamps, TILT", done:true},
 {s:"encarta",       n:"CD-ROM Encyclopedia", d:"90s Encarta — article tree, media panes, narration", done:true},
 {s:"atari-2600",    n:"Atari 2600",          d:"Woodgrain console + TV — fat-pixel SELECT GAME", done:true},
 {s:"polaroid",      n:"Polaroid Wall",       d:"Instant photos on cork — frames, marker captions", done:true},
 {s:"dot-matrix-receipt",n:"Dot-Matrix Printout",d:"Fanfold invoice — sprocket strips, green bars", done:true},
 {s:"subway-map",    n:"Transit Map",         d:"Beck-style diagram — coloured lines, interchanges", done:true},
];
const shown=T.filter(t=>t.s[0]!=="_");
document.getElementById("grid").innerHTML=shown.map((t,i)=>{
  const no=String(i+1).padStart(2,"0");
  const inner=`<span class="no">${no}</span><span class="nm">${t.n}</span><span class="er">${t.d}</span><span class="go">&#9654;</span>`;
  return t.done
    ? `<a class="row" href="templates/${t.s}/index.html" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="row soon">${inner}</div>`;
}).join("");
const built=shown.filter(t=>t.done).length;
document.getElementById("count").textContent=(built===shown.length?built:`${built} of ${shown.length}`)+" exhibits";
</script>
</body>
</html>
