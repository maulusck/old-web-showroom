<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Goldtone</title>
<!-- Jukebox — Wurlitzer-style tabletop selector. Chrome, warm bulbs, paper
     title strips. CSS gradients + inline SVG only; system fonts; offline. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="floor">
    <div class="jukebox">

      <!-- illuminated arched top: chrome arch + chasing warm bulbs -->
      <div class="dome">
        <svg class="arch" viewBox="0 0 400 190" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
          <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe6a8"/>
              <stop offset="0.45" stop-color="#ffb648"/>
              <stop offset="1" stop-color="#d1661d"/>
            </linearGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbfbfd"/>
              <stop offset="0.5" stop-color="#9aa0aa"/>
              <stop offset="0.5" stop-color="#5a5f68"/>
              <stop offset="1" stop-color="#cfd3da"/>
            </linearGradient>
          </defs>
          <path class="rim" d="M8 190 L8 104 Q8 14 200 14 Q392 14 392 104 L392 190 Z" fill="url(#rim)"/>
          <path d="M30 190 L30 108 Q30 40 200 40 Q370 40 370 108 L370 190 Z" fill="url(#glass)"/>
          <path class="sheen" d="M48 190 L48 110 Q48 58 200 58 Q300 58 340 86 Q260 70 150 96 Q80 112 72 190 Z" fill="#fff" opacity="0.22"/>
          <g class="bulbs" fill="#ffd678">
            <circle class="bulb" style="--i:0"  cx="30"  cy="150" r="7"/>
            <circle class="bulb" style="--i:1"  cx="30"  cy="104" r="7"/>
            <circle class="bulb" style="--i:2"  cx="42"  cy="66"  r="7"/>
            <circle class="bulb" style="--i:3"  cx="74"  cy="40"  r="7"/>
            <circle class="bulb" style="--i:4"  cx="118" cy="24"  r="7"/>
            <circle class="bulb" style="--i:5"  cx="160" cy="17"  r="7"/>
            <circle class="bulb" style="--i:6"  cx="200" cy="15"  r="7"/>
            <circle class="bulb" style="--i:7"  cx="240" cy="17"  r="7"/>
            <circle class="bulb" style="--i:8"  cx="282" cy="24"  r="7"/>
            <circle class="bulb" style="--i:9"  cx="326" cy="40"  r="7"/>
            <circle class="bulb" style="--i:10" cx="358" cy="66"  r="7"/>
            <circle class="bulb" style="--i:11" cx="370" cy="104" r="7"/>
            <circle class="bulb" style="--i:12" cx="370" cy="150" r="7"/>
          </g>
        </svg>
        <div class="brand">
          <h1 data-slot="site-name">The Goldtone</h1>
          <p class="tagline" data-slot="tagline">Model 1015 · Deluxe Reissue</p>
        </div>
      </div>

      <!-- marquee + coin invitation -->
      <div class="marquee">
        <span class="marq-text" data-slot="hero-title">Make a Selection</span>
        <p class="marq-sub" data-slot="hero-body">Five cents a play, three for a dime. Press a letter, press a number, and let the arm do the rest.</p>
      </div>

      <!-- deck: record + tonearm. Static at rest; JS swings the arm and names your pick -->
      <div class="deck">
        <svg class="turntable" viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="92" cy="104" r="82" fill="#2a2a2e" stroke="#0007" stroke-width="2"/>
          <g class="disc">
            <circle cx="92" cy="104" r="78" fill="#111114"/>
            <circle cx="92" cy="104" r="70" fill="none" stroke="#35353c" stroke-width="1"/>
            <circle cx="92" cy="104" r="60" fill="none" stroke="#35353c" stroke-width="1"/>
            <circle cx="92" cy="104" r="50" fill="none" stroke="#35353c" stroke-width="1"/>
            <circle cx="92" cy="104" r="40" fill="none" stroke="#35353c" stroke-width="1"/>
            <circle cx="92" cy="104" r="26" fill="url(#glass)"/>
            <circle cx="92" cy="104" r="4" fill="#161210"/>
          </g>
          <g class="arm">
            <circle cx="176" cy="40" r="9" fill="url(#rim)" stroke="#0007"/>
            <rect x="182" y="25" width="15" height="11" rx="2" fill="url(#rim)" stroke="#0006"/>
            <rect x="173" y="40" width="6" height="74" rx="3" fill="url(#rim)" stroke="#0006"/>
            <rect x="170" y="110" width="12" height="12" rx="2" fill="#2a2420"/>
          </g>
        </svg>
        <div class="now">
          <span class="now-label">Now Playing</span>
          <span class="now-sel" data-slot="status">Press a letter and a number</span>
        </div>
      </div>

      <!-- the title strips are the content: each paper strip is one track -->
      <div class="rack">
        <button class="strip" type="button">
          <span class="code">A1</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Chrome Heartbreak</span>
            <span class="artist" data-slot="card-body">Dottie Vane &amp; the Vanguards</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">A7</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Milkshake Moon</span>
            <span class="artist" data-slot="card-body">Sonny Castellano</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">B2</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Jukebox Sweetheart</span>
            <span class="artist" data-slot="card-body">The Rhinestone Rockets</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">B9</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Diner at Dawn</span>
            <span class="artist" data-slot="card-body">Lorraine Beaumont</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">C4</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Cherry Cola Twist</span>
            <span class="artist" data-slot="card-body">The Buddy Fontaine Trio</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">C8</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Last Dime Boogie</span>
            <span class="artist" data-slot="card-body">The Nickelodeons</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">D3</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Taillight Serenade</span>
            <span class="artist" data-slot="card-body">Vera Sparks</span>
          </span>
        </button>
        <button class="strip" type="button">
          <span class="code">E6</span>
          <span class="meta">
            <span class="song" data-slot="card-title">Teenage Comet</span>
            <span class="artist" data-slot="card-body">Ricky Marlowe &amp; the Hi-Fis</span>
          </span>
        </button>
      </div>

      <!-- selector console: chrome buttons + coin slot -->
      <div class="console">
        <div class="keys">
          <button class="key letter" type="button">A</button>
          <button class="key letter" type="button">B</button>
          <button class="key letter" type="button">C</button>
          <button class="key letter" type="button">D</button>
          <button class="key letter" type="button">E</button>
          <button class="key num" type="button">1</button>
          <button class="key num" type="button">2</button>
          <button class="key num" type="button">3</button>
          <button class="key num" type="button">4</button>
          <button class="key num" type="button">5</button>
          <button class="key num" type="button">6</button>
          <button class="key num" type="button">7</button>
          <button class="key num" type="button">8</button>
          <button class="key num" type="button">9</button>
        </div>
        <div class="coin">
          <span class="slot" aria-hidden="true"></span>
          <span class="coin-text" data-slot="nav-item">Drop a Nickel</span>
        </div>
      </div>

      <footer data-slot="footer">&copy; 1952–2026 The Goldtone Phonograph Co. · Minneapolis · Still spinning</footer>

    </div>
  </div>
  <script>
  // Cosmetic selection only: light the keys, name the pick, swing the arm. No audio/queue/storage.
  (() => {
    const strips = [...document.querySelectorAll('.strip')];
    const keys = [...document.querySelectorAll('.key')];
    const deck = document.querySelector('.deck');
    const out = document.querySelector('.now-sel');
    if (!deck || !out) return;
    let L = '', N = '';
    const codeOf = s => s.querySelector('.code').textContent.trim();
    const lamps = () => keys.forEach(k => {
      const v = k.textContent.trim();
      k.classList.toggle('lit', v === L || v === N);
    });
    const show = (strip, code) => {
      strips.forEach(s => s.classList.toggle('selected', s === strip));
      deck.classList.toggle('playing', !!strip);
      out.textContent = strip
        ? code + ' · ' + strip.querySelector('.song').textContent.trim()
        : code + ' · no record on that one';
    };
    strips.forEach(s => s.addEventListener('click', () => {
      const code = codeOf(s);
      [L, N] = [code[0], code.slice(1)];
      lamps();
      show(s, code);
    }));
    keys.forEach(k => k.addEventListener('click', () => {
      if (k.classList.contains('letter')) L = k.textContent.trim();
      else N = k.textContent.trim();
      lamps();
      if (L && N) show(strips.find(s => codeOf(s) === L + N) || null, L + N);
    }));
  })();
  </script>
  <script src="../../edit.js" defer></script>
</body>
</html>
